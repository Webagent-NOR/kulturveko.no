  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root {
      --bg: #ffffff;
      --ink: #1a1a18;
      --warm: #c4a882;
      --warm-muted: #b8a48a;
      --faded: #8a8478;
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Clean white — no texture */

    /* Decorative top/bottom lines */
    .border-line {
      position: fixed;
      left: 1.5rem;
      right: 1.5rem;
      height: 1px;
      background: var(--ink);
      opacity: 0.15;
      z-index: 1;
    }
    .border-line--top { top: 1.5rem; }
    .border-line--bottom { bottom: 1.5rem; }

    /* Corner marks */
    .corner {
      position: fixed;
      width: 18px;
      height: 18px;
      z-index: 2;
      opacity: 0.2;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--ink);
    }
    .corner::before { width: 1px; height: 100%; }
    .corner::after { width: 100%; height: 1px; }
    .corner--tl { top: 1.5rem; left: 1.5rem; }
    .corner--tl::before { top: 0; left: 0; }
    .corner--tl::after { top: 0; left: 0; }
    .corner--tr { top: 1.5rem; right: 1.5rem; }
    .corner--tr::before { top: 0; right: 0; }
    .corner--tr::after { top: 0; right: 0; }
    .corner--bl { bottom: 1.5rem; left: 1.5rem; }
    .corner--bl::before { bottom: 0; left: 0; }
    .corner--bl::after { bottom: 0; left: 0; }
    .corner--br { bottom: 1.5rem; right: 1.5rem; }
    .corner--br::before { bottom: 0; right: 0; }
    .corner--br::after { bottom: 0; right: 0; }

    .content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2rem;
      text-align: center;
    }

    /* Video — crop black bars, seamless on white */
    .logo-video {
      width: min(680px, 90vw);
      overflow: hidden;
    }
    .logo-video video {
      width: 100%;
      height: auto;
      display: block;
      scale: 1.6;
    }

    /* Date lockup */
    .date-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .date-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--faded);
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--ink);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--warm);
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-style: italic;
      font-weight: 400;
      color: var(--warm-muted);
      max-width: 28ch;
      line-height: 1.6;
    }

    /* Footer info */
    .footer {
      position: fixed;
      bottom: 2.5rem;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 3;
    }

    .footer-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--faded);
      opacity: 0.7;
    }

    .footer-credit {
      display: block;
      margin-top: 0.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--faded);
      opacity: 0.4;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .footer-credit:hover {
      opacity: 0.7;
    }

    /* Entrance animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .logo-video {
      animation: fadeIn 1.2s ease-out both;
    }
    .date-lockup {
      animation: fadeUp 0.8s ease-out 0.6s both;
    }
    .divider {
      animation: fadeUp 0.8s ease-out 0.8s both;
    }
    .tagline {
      animation: fadeUp 0.8s ease-out 1s both;
    }
    .footer {
      animation: fadeIn 1s ease-out 1.4s both;
    }
    .border-line, .corner {
      animation: fadeIn 1.2s ease-out 0.3s both;
    }

    @media (max-width: 480px) {
      .border-line { left: 1rem; right: 1rem; }
      .border-line--top { top: 1rem; }
      .border-line--bottom { bottom: 1rem; }
      .corner--tl { top: 1rem; left: 1rem; }
      .corner--tr { top: 1rem; right: 1rem; }
      .corner--bl { bottom: 1rem; left: 1rem; }
      .corner--br { bottom: 1rem; right: 1rem; }
      .footer { bottom: 2rem; }
    }
  </style>
</head>
<body>

  <div class="border-line border-line--top"></div>
  <div class="border-line border-line--bottom"></div>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main class="content">
    <div class="logo-video">
      <video autoplay muted playsinline>
        <source src="Animasjon_av_tekst_for_nettside.mp4" type="video/mp4">
      </video>
    </div>

    <div class="date-lockup">
      <span class="date-label">Sett av datoane</span>
      <span class="date">19.–27. juni 2026</span>
    </div>

    <div class="divider"></div>

    <p class="tagline">Meir informasjon kjem snart</p>
  </main>

  <footer class="footer">
    <span class="footer-text">Os &middot; Bjørnafjorden</span>
    <a href="https://webagent.no" target="_blank" rel="noopener" class="footer-credit">Levert av Webagent</a>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
